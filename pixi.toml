[workspace]
name = "fasthep-distributed"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11"
pip = "*"
python-build = "*"
hatchling = "*"
hatch-vcs = "*"
pytest = "*"
conda-pack = "*"
dask = "*"
dask-jobqueue = "*"
distributed = "*"
ruff = "*"
mypy = "*"
pre-commit = "*"
codespell = "*"
twine = "*"
sphinx = "*"
myst-parser = "*"
pydata-sphinx-theme = "*"
sphinx-copybutton = "*"
sphinx-design = "*"

[pypi-dependencies]
fasthep-distributed = { path = ".", editable = true }
fasthep-flow = ">=2026.8.4.dev0"
vulture = ">=2.16, <3"
deptry = ">=0.25.1, <0.26"
pytest = "*"

[environments]
py311 = ["py311"]
py312 = ["py312"]
py313 = ["py313"]
py314 = ["py314"]
docs = ["docs"]

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[feature.docs.dependencies]
python = ">=3.11"
sphinx = "*"
myst-parser = "*"
pydata-sphinx-theme = "*"
sphinx-copybutton = "*"
sphinx-design = "*"
sphinx-autobuild = "*"

[tasks]
format = "ruff format src tests"
lint = "ruff check src tests"
lint-fix = "ruff check --fix src tests"
typecheck = "mypy src tests"
test = "pytest"
build = "python -m build"
check = { depends-on = ["lint", "typecheck", "test"] }
ci = { depends-on = ["check", "build"] }
check-dist = "twine check dist/*"
docs-build = "sphinx-build -b html docs docs/_build/html"
docs-clean = "rm -rf docs/_build"
docs-serve = "WATCHFILES_DEBUG=1 sphinx-autobuild docs docs/_build/html -a"
